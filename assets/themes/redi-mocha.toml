[meta]
format = 1
id = "redi-mocha"
name = "Redi-Mocha"
version = "1.0"
description = "Catppuccin Mocha with mauve accents and the Auckland skyline."

[theme]
# Catppuccin Mocha: https://catppuccin.com/palette/#mocha
# Base #1e1e2e, mantle #181825, crust #11111b; mauve #cba6f7.
# Keep RediWM's default fonts and geometry.
taskbar_size = 44

# Window chrome
window_bg = "rgba(24,24,37,0.80)"
window_fg = "#cdd6f4"
window_dim = "#bac2de"
window_border = "#45475a"
window_border_hover = "#cba6f7"
workspace_active_border = "#cba6f7"
window_divider = "#313244"
window_close_hover = "#f38ba8"
window_close_fg = "#11111b"

# App windows (Files, Images, PDF, Editor)
text_secondary = "#bac2de"
app_bg = "#1e1e2e"
app_toolbar = "#181825"
app_sidebar = "#181825"
app_bar = "#313244"
app_item = "#1e1e2e"
app_item_hover = "#313244"
app_item_border = "#45475a"
app_item_selected = "rgba(203,166,247,0.20)"
app_nav_selected = "rgba(203,166,247,0.20)"
app_git_added = "#a6e3a1"
app_divider = "#313244"
app_icon = "#bac2de"
scrollbar_thumb = "#6c7086"
scrollbar_thumb_active = "#cba6f7"

# Shell palette
bg = "#11111b"
fg = "#cdd6f4"
dim = "#bac2de"
faint = "#a6adc8"
accent = "#cba6f7"
accent_2 = "#89b4fa"
accent_3 = "#f5c2e7"
danger = "#f38ba8"
on_accent = "#11111b"
shell_accent = "#cba6f7"
shell_on_accent = "#11111b"
shell_border_focus = "#cba6f7"
surface = "#313244"
surface_hover = "#45475a"
border = "#45475a"
border_soft = "#313244"
border_hover = "#585b70"
border_focus = "#cba6f7"
glass = "rgba(30,30,46,0.56)"
glass_strong = "rgba(24,24,37,0.74)"
shadow = "rgba(17,17,27,0.55)"
border_glow = "rgba(203,166,247,0.55)"

# Taskbar and shared controls
taskbar_bg = "rgba(24,24,37,0.96)"
taskbar_surface = "#313244"
taskbar_hover = "#45475a"
taskbar_border = "#45475a"
start_button_logo_color = "#cba6f7"
start_button_hover = "rgba(203,166,247,0.12)"
start_button_indicator = "#cba6f7"
toggle_track = "#45475a"
control_thumb = "#cdd6f4"
slider_track = "#45475a"
pill_bg = "#313244"
swatch_border = "#585b70"
swatch_border_selected = "#cba6f7"
settings_card_bg = "#313244"

# Start menu and fields; caret and text selection follow the accent.
start_menu_bg = "rgba(30,30,46,0.98)"
start_menu_border = "#45475a"
start_menu_search_bg = "#11111b"
start_menu_selected_bg = "rgba(203,166,247,0.15)"
start_menu_selected_border = "rgba(203,166,247,0.40)"
start_menu_selected_marker = "#cba6f7"
field_bg = "#11111b"
field_border = "#585b70"
selection_alpha = 0.30

# Lock screen, window switcher, calendar and overlays
lock_bg = "#11111b"
lock_fg = "#cdd6f4"
lock_dim = "#a6adc8"
lock_divider = "#45475a"
lock_session_fg = "#bac2de"
lock_wallpaper_opacity = 0.24
switcher_bg = "#181825"
switcher_border = "#45475a"
switcher_item_bg = "#1e1e2e"
switcher_item_border = "#45475a"
switcher_fg = "#cdd6f4"
switcher_dim = "#a6adc8"
switcher_icon_bg = "#313244"
switcher_selected_border = "#cba6f7"
calendar_border = "#45475a"
osd_border = "#45475a"
screenshot_border = "#cba6f7"
screenshot_fg = "#cdd6f4"
screenshot_label_bg = "rgba(24,24,37,0.95)"
screenshot_label_border = "#45475a"
battery_bg = "rgba(17,17,27,0.28)"
battery_full = "#a6e3a1"
battery_low = "#f9e2af"
battery_critical = "#f38ba8"
battery_shimmer = "#94e2d5"

# Desktop selections and file artwork
desktop_fg = "#cdd6f4"
desktop_hover = "rgba(203,166,247,0.08)"
desktop_selected = "rgba(203,166,247,0.20)"
desktop_selection = "rgba(203,166,247,0.15)"
desktop_selection_border = "#cba6f7"
desktop_drop_border = "rgba(203,166,247,0.80)"
desktop_dialog_bg = "rgba(30,30,46,0.98)"
desktop_notice_bg = "rgba(49,50,68,0.95)"
desktop_icon_start = "#89b4fa"
desktop_icon_end = "#cba6f7"
file_broken = "#f38ba8"
file_folder_back = "#89b4fa"
file_folder_front = "#b4befe"
file_document = "#bac2de"
file_document_lines = "#45475a"
file_spinner = "#cba6f7"
image_checker_dark = "#1e1e2e"
image_checker_light = "#313244"
image_crop_border = "#cdd6f4"
image_crop_grid = "rgba(205,214,244,0.40)"
pdf_loading = "#a6adc8"
pdf_search_match = "rgba(249,226,175,0.40)"
pdf_search_match_active = "rgba(250,179,135,0.65)"

[layout]
taskbar_position = "bottom"
dock_enabled = false

[assets]
color_scheme = "dark"
wallpaper = "wallpaper-mocha.png"
